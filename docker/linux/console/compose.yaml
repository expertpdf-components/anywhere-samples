# ExpertPdf Anywhere, Linux console sample. From this folder:
#   docker compose run --build --rm expertpdf-console
#   # the PDF appears in ./out/output.pdf
services:
  expertpdf-console:
    build:
      context: ../../..                   # the samples folder
      dockerfile: docker/linux/console/Dockerfile
    image: expertpdf-anywhere:console-linux
    volumes:
      - ./out:/out
