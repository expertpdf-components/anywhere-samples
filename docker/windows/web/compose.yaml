# ExpertPdf Anywhere, Windows web sample. From this folder:
#   docker compose up --build
#   # then open http://localhost:8080
services:
  expertpdf-web:
    build:
      context: ../../..                   # the samples folder
      dockerfile: docker/windows/web/Dockerfile
    image: expertpdf-anywhere:web-windows
    ports:
      - "8080:8080"
