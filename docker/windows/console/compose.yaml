# ExpertPdf Anywhere, Windows console sample. From this folder:
#   docker compose run --build --rm expertpdf-console
#   # the PDF appears in ./out/output.pdf
services:
  expertpdf-console:
    build:
      context: ../../..                   # the samples folder
      dockerfile: docker/windows/console/Dockerfile
    image: expertpdf-anywhere:console-windows
    volumes:
      - ./out:C:/out
